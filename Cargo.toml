[workspace]
resolver = "2"
members = ["crates/core", "crates/fetcher", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Videleum contributors"]
repository = "https://github.com/videleum/videleum"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
quick-xml = "0.41"
url = "2"
dirs = "6"
md-5 = "0.10"
ureq = { version = "3", features = ["gzip"] }
futures = "0.3"
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
