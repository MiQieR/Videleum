[package]
name = "videleum-desktop"
version = "0.1.0"
edition = "2024"
description = "Videleum Native Desktop Application powered by GPUI and GPUI Kit"
license = "MIT"

[[bin]]
name = "Videleum"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
