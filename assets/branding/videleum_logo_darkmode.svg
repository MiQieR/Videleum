<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- 播放按钮渐变：粉红至亮紫 -->
    <linearGradient id="playGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FF1A6B" />
      <stop offset="45%" stop-color="#DE0099" />
      <stop offset="100%" stop-color="#7B12FF" />
    </linearGradient>

    <!-- 顶部红色/粉色段渐变 -->
    <linearGradient id="pinkGrad" x1="10%" y1="60%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#FF185D" />
      <stop offset="60%" stop-color="#FF1F6D" />
      <stop offset="100%" stop-color="#FF2D7D" />
    </linearGradient>

    <!-- 右侧及底部亮蓝/青色渐变 -->
    <linearGradient id="cyanGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00A8FF" />
      <stop offset="60%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- 左下角气泡尾部紫色渐变 -->
    <linearGradient id="purpleGrad" x1="20%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#6B14FF" />
      <stop offset="60%" stop-color="#6010F5" />
      <stop offset="100%" stop-color="#7824FF" />
    </linearGradient>

    <!-- 顶层外弧（红粉色）渐变 -->
    <linearGradient id="arcPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FF0B5E" />
    </linearGradient>

    <!-- 顶层内弧（紫色）渐变 -->
    <linearGradient id="arcPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8426FF" />
      <stop offset="100%" stop-color="#6011FF" />
    </linearGradient>
  </defs>

  <!-- 背景底色 -->
  <rect width="1000" height="1000" fill="#000000" />

  <!-- ==================== 右上角无线波纹弧线 ==================== -->
  <g fill="none" stroke-linecap="round">
    <!-- 外层红粉色弧 -->
    <path d="M 724 162 A 155 155 0 0 1 866 304" stroke="url(#arcPink)" stroke-width="44" />
    <!-- 内层紫色弧 -->
    <path d="M 724 218 A 98 98 0 0 1 814 304" stroke="url(#arcPurple)" stroke-width="44" />
  </g>

  <!-- ==================== 主外框与对话气泡主体 ==================== -->
  <!-- 1. 左下部 & 气泡尾巴 (紫色区块) -->
  <path d="M 165 486
           L 242 486
           L 242 615
           C 242 638 260 657 283 657
           L 522 657
           L 562 735
           L 295 845
           L 295 735
           L 260 735
           C 207 735 165 693 165 640
           Z" fill="url(#purpleGrad)" />

  <!-- 2. 左上角及顶部左半段 (红粉色区块) -->
  <path d="M 165 486
           L 165 360
           C 165 300 215 250 275 250
           L 462 250
           L 462 292
           L 494 292
           L 494 328
           C 494 328 320 328 285 328
           C 261 328 242 347 242 371
           L 242 486
           Z" fill="url(#pinkGrad)" />

  <!-- 3. 右半部及底部右侧段 (青蓝色区块) -->
  <path d="M 494 250
           L 680 250
           C 740 250 790 300 790 360
           L 790 625
           C 790 685 740 735 680 735
           L 562 735
           L 522 657
           L 670 657
           C 693 657 712 638 712 615
           L 712 371
           C 712 347 693 328 670 328
           L 494 328
           Z" fill="url(#cyanGrad)" />

  <!-- ==================== 像素故障方块 (Glitch Pixels) ==================== -->
  <!-- 顶部像素块 -->
  <rect x="508" y="210" width="38" height="40" fill="#FF2668" />
  <rect x="494" y="250" width="14" height="42" fill="#FF1E60" />

  <!-- 左侧外凸与内凹像素块 -->
  <rect x="118" y="485" width="37" height="37" fill="#6B16FF" />
  <rect x="155" y="452" width="37" height="34" fill="#6B16FF" />
  <rect x="190" y="490" width="35" height="52" fill="#000000" />

  <!-- 右侧外凸与内凹像素块 -->
  <rect x="756" y="554" width="34" height="46" fill="#000000" />
  <rect x="813" y="522" width="33" height="34" fill="#00D0FF" />
  <rect x="825" y="574" width="41" height="41" fill="#00B8FF" />

  <!-- ==================== 中央播放三角图标 ==================== -->
  <!-- 顶点圆角处理的平滑三角形 -->
  <path d="M 406 401
           C 392 393 384 402 384 419
           L 384 588
           C 384 605 393 614 407 606
           L 579 519
           C 594 511 594 496 579 487
           Z" fill="url(#playGrad)" />
</svg>