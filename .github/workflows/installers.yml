name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        run: |
          version=$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build universal binary
        run: |
          cargo build --release --locked -p videleum --target aarch64-apple-darwin
          cargo build --release --locked -p videleum --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/videleum \
            target/x86_64-apple-darwin/release/videleum \
            -output dist/videleum
          lipo -info dist/videleum

      - name: Package app and DMG
        run: |
          bash packaging/macos/package.sh "${{ steps.version.outputs.version }}" dist/videleum dist

      - uses: actions/upload-artifact@v4
        with:
          name: videleum-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --locked -p videleum

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/videleum.exe packaging/windows/videleum.exe -Force
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DRepoRoot=${{ github.workspace }}" `
            "/DOutputDir=${{ github.workspace }}\dist" `
            "packaging/windows/videleum.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: videleum-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
          generate_release_notes: true
